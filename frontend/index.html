<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agenda · 日程表</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <script>
    // 页面必须由后端提供（/static 与 /api 都依赖后端），
    // 直接双击打开 index.html 时给出提示，避免出现空白页。
    if (location.protocol === "file:") {
      document.body.innerHTML =
        '<p style="font: 15px/1.6 system-ui, sans-serif; padding: 32px;">' +
        "请先启动后端，再通过 <b>http://127.0.0.1:8000</b> 访问本页面（不要直接打开 index.html）。" +
        "</p>";
    }
  </script>

  <main class="app">
    <!-- 月视图 -->
    <section id="month-view" class="view">
      <div class="card">
        <div class="month-topbar">
          <button id="prev-month" class="icon-btn" type="button" aria-label="上个月">‹</button>
          <h1 class="month-title" id="month-title"></h1>
          <button id="next-month" class="icon-btn" type="button" aria-label="下个月">›</button>
        </div>

        <div class="month-weekdays">
          <span>周日</span>
          <span>周一</span>
          <span>周二</span>
          <span>周三</span>
          <span>周四</span>
          <span>周五</span>
          <span>周六</span>
        </div>

        <div class="month-grid" id="month-grid"></div>

        <p class="month-hint">点击任意一周，查看该周的详细日程</p>
      </div>
    </section>

    <!-- 周视图 -->
    <section id="week-view" class="view" hidden>
      <div class="week-toolbar">
        <div class="week-toolbar-side">
          <button id="back-to-month" class="pill-btn" type="button">‹ 月视图</button>
          <button id="prev-week" class="icon-btn" type="button" aria-label="上一周" title="上一周">‹</button>
        </div>
        <span class="week-range" id="week-range"></span>
        <div class="week-toolbar-side week-toolbar-side--end">
          <button id="next-week" class="icon-btn" type="button" aria-label="下一周" title="下一周">›</button>
        </div>
      </div>

      <div class="card">
        <div class="calendar-scroll" id="calendar-scroll">
          <div class="cal-header" id="cal-header">
            <div class="corner" id="corner"></div>
          </div>
          <div class="cal-body" id="cal-body">
            <div class="time-gutter" id="time-gutter"></div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <div class="status" id="status" hidden></div>

  <script src="/static/js/app.js"></script>
</body>
</html>
